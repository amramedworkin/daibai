version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daibai-api-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Force local Redis in Docker (overrides .env Azure URL)
      REDIS_URL: redis://daibai-redis:6379
      AZURE_REDIS_CONNECTION_STRING: ""
    volumes:
      # Mount the local directory into the container so code changes reflect instantly
      - .:/app
    depends_on:
      daibai-redis:
        condition: service_healthy
    # Force uvicorn to reload on code changes in dev mode
    command: ["uvicorn", "daibai.api.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  daibai-redis:
    image: redis/redis-stack-server:latest
    container_name: daibai-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
    name: daibai_redis_data_local
